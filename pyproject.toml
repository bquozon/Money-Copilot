[project]
name = "money-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Barthélémy Coquoz", email = "cobarth2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "typing>=3.10.0.0",
]

[project.scripts]
money-copilot = "money_copilot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]